<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; letter-spacing: 1.5px; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    .anim-pulse { transform-origin: center; animation: pulse 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic/Animated Background Flow Elements (Behind Text) -->
  <g opacity="0.25">
    <circle cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#glow)" class="anim-pulse"/>
    <circle cx="1000" cy="260" r="220" fill="#c084fc" filter="url(#glow)" class="anim-pulse" style="animation-delay: -3s;"/>
  </g>

  <!-- Grid Lines background -->
  <line x1="100" y1="50" x2="100" y2="300" class="grid-line" />
  <line x1="350" y1="50" x2="350" y2="300" class="grid-line" />
  <line x1="600" y1="50" x2="600" y2="300" class="grid-line" />
  <line x1="850" y1="50" x2="850" y2="300" class="grid-line" />
  <line x1="1100" y1="50" x2="1100" y2="300" class="grid-line" />

  <line x1="50" y1="100" x2="1150" y2="100" class="grid-line" />
  <line x1="50" y1="200" x2="1150" y2="200" class="grid-line" />
  <line x1="50" y1="300" x2="1150" y2="300" class="grid-line" />

  <!-- Animated Dynamic Chart Line (Background Accent) -->
  <path d="M 50 280 Q 200 240, 350 260 T 650 180 T 950 120 T 1150 70" fill="none" stroke="url(#line-grad)" stroke-width="4" filter="url(#glow)" stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Data Node Pulsing Dots -->
  <circle cx="350" cy="260" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="6" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="950" cy="120" r="6" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="1150" cy="70" r="8" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Foreground Content (Always clear & visible) -->
  <g transform="translate(80, 0)">
    <rect x="0" y="65" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="140" y="86" text-anchor="middle" class="tag">⚡ CURATED REVOPS &amp; ML ECOSYSTEM</text>

    <text x="0" y="165" class="title" filter="url(#glow)">Awesome AI Sales Forecasting 📈</text>

    <text x="0" y="215" class="subtitle">Commercial Revenue Intelligence Platforms &amp; Open-Source Time-Series ML</text>
    
    <!-- Pills/Badges in Hero Banner -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">🎯 Revenue Intelligence</text>

      <rect x="195" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="285" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">📊 Demand Forecasting</text>

      <rect x="390" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="480" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">🧠 Neural Time-Series</text>

      <rect x="585" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="675" y="23" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94a3b8">🔮 Deal Deal Scoring</text>
    </g>
  </g>
</svg>
